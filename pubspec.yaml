name: zocoplay
description: "ZocoPlay: find and book sports courts."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.2
  crypto: ^3.0.7
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  hugeicons: 1.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  razorpay_flutter: ^1.4.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B8A5B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
